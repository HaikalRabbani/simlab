# SIMLAB Jabar — infrastructure for local/staging/production databases.
#
# Spec Bagian 4: database pilihan adalah MySQL atau PostgreSQL (PostgreSQL
# disarankan untuk query agregat/analisis). File ini menyiapkan PostgreSQL
# untuk deployment/staging. Untuk dev lokal cukup pakai SQLite (default .env).
#
# Cara pakai:
#   1. docker compose up -d db
#   2. cp .env.example .env  (atau edit .env: DB_CONNECTION=pgsql, dst. di bawah)
#   3. cd backend && php artisan migrate --seed
#
# Catatan: pastikan ekstensi PHP pdo_pgsql sudah aktif (php -m | grep pgsql).

services:
  db:
    image: postgres:16-alpine
    container_name: simlab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simlab}
      POSTGRES_USER: ${POSTGRES_USER:-simlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simlab_secret}
    ports:
      - "5432:5432"
    volumes:
      - simlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simlab} -d ${POSTGRES_DB:-simlab}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  simlab_pgdata: